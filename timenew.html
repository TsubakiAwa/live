<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>OBS Live Time</title>
    <style>
        /* 引入类似数码管的字体 (Google Fonts) */
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* OBS 关键：网页本身背景透明 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* 优先使用微软雅黑，如果没有则用系统默认无衬线字体 */
            font-family: 'Roboto Mono', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        /* 整体容器 */
        .widget-container {
            display: flex;
            align-items: stretch;
            /* 【关键修改】这里控制背景透明度 */
            /* rgba(红, 绿, 蓝, 透明度) -> 0.0是完全透明，1.0是完全不透明 */
            background-color: rgba(26, 26, 26, 0.3);
            border-radius: 4px; /* 轻微圆角，更现代 */
            overflow: hidden;   /* 防止内容溢出圆角 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); /* 增加一点阴影，更有层次感 */
        }

        /* 左侧蓝色竖条 */
        .accent-bar {
            width: 8px;
            background-color: #007bff; /* 亮蓝色 */
        }

        /* 内容区域 */
        .content-area {
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #ffffff;
            min-width: 280px; /* 保证最小宽度，防止时间变短时抖动 */
        }

        /* 第一行：时间 + 直播状态 */
        .top-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 2px;
        }

        .time-display {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 1;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: bold;
            color: #eeeeee;
        }

        /* 呼吸灯效果的小圆点 */
        .dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30; /* 红色圆点 */
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        /* 第二行：日期 + 星期 */
        .bottom-row {
            font-size: 14px;
            color: #aaaaaa; /* 稍微暗一点的灰色 */
            letter-spacing: 0.5px;
            text-transform: uppercase; /* 强制英文大写 */
        }

        /* 定义呼吸动画 */
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <!-- 左侧装饰条 -->
        <div class="accent-bar"></div>

        <!-- 文字内容区 -->
        <div class="content-area">
            <!-- 上行 -->
            <div class="top-row">
                <div class="time-display" id="clock">00:00:00</div>
                <div class="live-status">
                    <div class="dot"></div>
                    <span>LIVE</span>
                </div>
            </div>

            <!-- 下行 -->
            <div class="bottom-row" id="date-display">
                LOADING...
            </div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();

            // 1. 获取时间 (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            // 2. 获取日期 (YYYY/MM/DD)
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');

            // 3. 获取星期 (自动适配中文环境)
            // toLocaleDateString 会根据浏览器/系统语言自动显示 "Saturday" 或 "星期六"
            const weekDay = now.toLocaleDateString('zh-CN', { weekday: 'long' });

            // 组合显示
            document.getElementById('date-display').textContent = `${year}/${month}/${day} | ${weekDay}`;
        }

        // 初始化并每秒更新
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
